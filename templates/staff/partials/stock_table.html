{% for product in low_stock_products %}
<tr class="group hover:bg-red-50/20 transition-all duration-300">
    <td class="px-4 sm:px-8 py-4 sm:py-6">
        <div class="flex flex-col">
            <span class="text-sm font-black text-gray-900 tracking-tight leading-none mb-1 group-hover:text-red-600 transition-colors uppercase italic">{{ product.name }}</span>
            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em]">REF: #{{ product.id }}</span>
        </div>
    </td>
    <td class="hidden sm:table-cell px-8 py-6 text-[10px] font-bold text-gray-500 uppercase tracking-widest italic">{{ product.category.name }}</td>
    <td class="px-4 sm:px-8 py-4 sm:py-6">
        <span class="px-3 py-1 rounded-lg text-[10px] font-black {% if product.stock == 0 %}bg-red-100 text-red-700{% else %}bg-orange-100 text-orange-700{% endif %} uppercase tracking-widest">
            {{ product.stock }} UNIDADES
        </span>
    </td>
    {% if perms.products.change_product %}
    <td class="px-4 sm:px-8 py-4 sm:py-6 text-right">
        <a href="{% url 'products:product_update' product.id %}" class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-gray-50 text-gray-400 hover:text-white hover:bg-gray-950 transition-all border border-gray-100">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        </a>
    </td>
    {% endif %}
</tr>
{% empty %}
<tr>
    <td colspan="4" class="px-8 py-16 text-center">
        <div class="flex flex-col items-center">
            <div class="h-12 w-12 rounded-2xl bg-green-50 text-green-500 flex items-center justify-center mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <p class="text-[10px] font-black text-gray-300 uppercase tracking-widest italic">Inventario en buen estado</p>
        </div>
    </td>
</tr>
{% endfor %}
