{% if messages %}
<div id="toast-container" class="fixed top-8 right-8 z-[100] space-y-4 max-w-sm">
    {% for message in messages %}
    <div class="toast-notification flex items-center gap-4 px-6 py-4 rounded-3xl shadow-2xl border-2 animate-toast-in
        {% if message.tags == 'success' %}bg-white border-emerald-50 text-emerald-600
        {% elif message.tags == 'error' %}bg-white border-red-50 text-red-600
        {% else %}bg-white border-orange-50 text-orange-600{% endif %}">
        <div class="h-10 w-10 rounded-2xl flex items-center justify-center
            {% if message.tags == 'success' %}bg-emerald-50
            {% elif message.tags == 'error' %}bg-red-50
            {% else %}bg-orange-50{% endif %} shadow-inner flex-shrink-0">
            {% if message.tags == 'success' %}
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            {% elif message.tags == 'error' %}
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            {% else %}
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            {% endif %}
        </div>
        <div class="flex flex-col min-w-0">
            <span class="text-[10px] font-black uppercase tracking-widest opacity-40">Notificación</span>
            <p class="text-sm font-black text-gray-900 tracking-tight">{{ message }}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="ml-2 p-2 text-gray-300 hover:text-gray-600 transition-colors flex-shrink-0">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    {% endfor %}
</div>
<script>
    setTimeout(() => {
        document.querySelectorAll('.toast-notification').forEach((toast, i) => {
            setTimeout(() => {
                toast.style.transition = 'opacity 0.5s, transform 0.5s';
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 500);
            }, 4000 + (i * 500));
        });
    }, 100);
</script>
{% endif %}
