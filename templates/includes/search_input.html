<!-- Reusable Search Input for Staff Panels -->
<div class="relative min-w-[240px]">
    <input type="text" 
           id="{{ search_id|default:'genericSearch' }}" 
           data-search-target="{{ target_id }}" 
           data-search-item="{{ item_selector }}"
           data-search-empty="{{ empty_state_id }}"
           class="generic-search-input w-full pl-10 pr-4 py-2 rounded-xl bg-gray-50 border border-gray-100 text-[10px] font-bold text-gray-600 placeholder:text-gray-300 focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:bg-white transition-all outline-none uppercase tracking-widest"
           placeholder="{{ placeholder|default:'Buscar...' }}">
    <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
</div>
