{% extends "base.html" %}

{% block title %}404 - Página No Encontrada{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center px-4">
    <div class="relative mb-10">
        <div class="absolute -inset-4 bg-orange-100/50 rounded-full blur-2xl"></div>
        <div class="relative bg-white p-8 rounded-full shadow-xl border border-orange-50">
            <svg class="h-24 w-24 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
    </div>
    
    <div class="text-center max-w-lg">
        <h1 class="text-6xl font-black text-gray-900 tracking-tighter mb-4">404</h1>
        <h2 class="text-3xl font-extrabold text-orange-600 mb-6 leading-tight">Página no encontrada</h2>
        <p class="text-gray-500 text-lg mb-10 font-medium">
            Parece que te has perdido. La página que estás buscando no existe en Kokori Broaster o ha sido movida temporalmente.
        </p>
        
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <button onclick="window.history.back()" class="px-8 py-4 bg-white border-2 border-gray-200 text-gray-700 font-bold rounded-2xl hover:bg-gray-50 hover:border-gray-300 transition-all duration-300 shadow-sm">
                Volver atrás
            </button>
            <a href="/" class="px-8 py-4 bg-orange-600 text-white font-bold rounded-2xl hover:bg-orange-700 hover:shadow-lg hover:shadow-orange-200 transition-all duration-300">
                Ir al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
