{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokori Broaster - {% block title %}Inicio{% endblock %}</title>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/plsnzZcACEJRh8voWcmOtNthW7kGsn6p09gAOk2G0M6pUY6rWcI9x2ncuKg" crossorigin="anonymous"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 font-sans leading-normal tracking-normal flex flex-col min-h-screen">
    
    {% block layout %}
        {% block header %}{% endblock %}

        <main class="flex-grow w-full max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </main>

        {% block footer %}{% endblock %}
    {% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
